    <h1>Contact</h1>
    <section class="container-fluid px-0">
        <div class="text-center">
            <form action="mail_handler.php" method="post">
                <label for="name">Name:</label>
                <input type="text" name="name" required><br>
                <label for="email">Email:</label>
